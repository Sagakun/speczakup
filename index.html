<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СпецЗакуп — демо площадки закупок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F6;--surface:#FFFFFF;--surface-2:#EEF0F2;--ink:#1E2226;--ink-2:#5A626A;--line:#DCE0E4;
  --accent:#F26B1D;--accent-ink:#FFFFFF;--accent-soft:#FDEBDF;--accent-text:#B8490A;
  --ok:#2E7D4F;--ok-soft:#E2F2E8;--warn:#9A5600;--warn-soft:#FFF0D2;--bad:#B3261E;--bad-soft:#FBE3E1;
  --panel:#22262B;--panel-ink:#F3F4F5;--panel-ink-2:#A9B0B7;--panel-line:#3A4046;
  --radius-s:6px;--radius-m:10px;--radius-l:16px;
  --display:"Unbounded","Arial Black",Arial,sans-serif;
  --text:"Onest","Segoe UI",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171A;--surface:#1D2125;--surface-2:#262B30;--ink:#EDEFF1;--ink-2:#A3ABB3;--line:#343A40;
  --accent:#FF7A2E;--accent-ink:#1A0E06;--accent-soft:#3A2416;--accent-text:#FFA06A;
  --ok:#62C28F;--ok-soft:#1B3326;--warn:#E8AB4F;--warn-soft:#3A2E17;--bad:#F08A82;--bad-soft:#3D1D1B;
  --panel:#0E1012;--panel-ink:#F3F4F5;--panel-ink-2:#9AA2AA;--panel-line:#2E3338;
}}
:root[data-theme="dark"]{
  --bg:#14171A;--surface:#1D2125;--surface-2:#262B30;--ink:#EDEFF1;--ink-2:#A3ABB3;--line:#343A40;
  --accent:#FF7A2E;--accent-ink:#1A0E06;--accent-soft:#3A2416;--accent-text:#FFA06A;
  --ok:#62C28F;--ok-soft:#1B3326;--warn:#E8AB4F;--warn-soft:#3A2E17;--bad:#F08A82;--bad-soft:#3D1D1B;
  --panel:#0E1012;--panel-ink:#F3F4F5;--panel-ink-2:#9AA2AA;--panel-line:#2E3338;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;background:none;border:0;padding:0}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.logo-mark svg{width:18px;height:18px}
.demo-pill{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 10px}
.roles{display:flex;background:var(--surface-2);border-radius:var(--radius-m);padding:3px;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
.roles button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tour-btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:9px 16px;border-radius:var(--radius-m);white-space:nowrap}
@media (max-width:760px){.top-in{gap:10px;padding:10px 14px}.roles{order:3;margin-left:0;width:100%}.roles button{flex:1;padding:8px 6px;font-size:13px}.tour-btn{margin-left:auto;padding:8px 12px;font-size:14px}.demo-pill{display:none}}

main{max-width:1200px;margin:0 auto;padding:24px 20px 120px}
@media (max-width:760px){main{padding:16px 14px 150px}}

/* buttons, chips */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:var(--radius-m);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent-text)}
.chip.mute{background:var(--surface-2);color:var(--ink-2)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:28px 0 48px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.4vw,52px);letter-spacing:-.02em;line-height:1.08}
.hero .lead{font-size:18px;color:var(--ink-2);margin-top:18px;max-width:34em}
.hero .cta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.live{background:var(--panel);color:var(--panel-ink);border-radius:var(--radius-l);padding:22px}
.live-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.live-head b{font-size:16px}
.live .items{margin:14px 0 18px;padding:0;list-style:none;border-top:1px solid var(--panel-line)}
.live .items li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--panel-line);font-size:14px;color:var(--panel-ink-2)}
.live .items li span:last-child{color:var(--panel-ink)}
.offer-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.06);border-radius:var(--radius-m);padding:10px 12px;margin-top:8px;opacity:0;transform:translateY(8px);animation:arrive .5s ease forwards}
.offer-row:nth-of-type(1){animation-delay:.8s}.offer-row:nth-of-type(2){animation-delay:1.9s}.offer-row:nth-of-type(3){animation-delay:3s}
@keyframes arrive{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.offer-row{animation:none;opacity:1;transform:none}}
.offer-row .t{font-size:12px;color:var(--panel-ink-2);white-space:nowrap}
.offer-row .p{font-weight:700}
.live-foot{margin-top:14px;font-size:13px;color:var(--panel-ink-2)}
.home-sec{padding:36px 0;border-top:1px solid var(--line)}
.home-sec h2{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.01em;max-width:24em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:26px;counter-reset:s}
.steps li{list-style:none;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-bottom:12px}
.steps h3{font-size:17px}
.steps p{color:var(--ink-2);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.side-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:22px}
.side-box h3{font-size:18px}
.side-box ul{margin:12px 0 18px;padding-left:18px;color:var(--ink-2)}
.side-box li{margin:4px 0}
.segs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.segs span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500}
.foot{margin-top:24px;padding:24px;border-radius:var(--radius-l);background:var(--panel);color:var(--panel-ink);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.foot p{color:var(--panel-ink-2);font-size:14px}
.foot a{color:var(--panel-ink);font-weight:700;font-size:20px;text-decoration:none}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:28px;padding-top:8px}.steps{grid-template-columns:1fr;gap:18px}.two{grid-template-columns:1fr}}

/* cabinet */
.cab{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.cab > section{min-width:0}
.cab-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:2px}
.who{font-size:13px;color:var(--ink-2);padding:0 12px 12px}
.who b{display:block;color:var(--ink);font-size:14px}
.cab-nav button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-weight:500;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.cab-nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.cab-nav .cnt{font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-weight:700}
@media (max-width:860px){.cab{grid-template-columns:minmax(0,1fr);gap:14px}.cab-nav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}.who{display:none}.cab-nav button{white-space:nowrap;background:var(--surface);border:1px solid var(--line)}.cab-nav button[aria-current="page"]{box-shadow:none;border-color:var(--accent)}}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.page-h p{color:var(--ink-2);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px}
.panel + .panel{margin-top:16px}
.panel h2{font-size:17px;font-weight:700;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.req-card{display:grid;grid-template-columns:1fr auto;gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;text-align:left;width:100%}
.req-card:hover{border-color:var(--ink-2)}
.req-card .rc-t{font-size:16px;font-weight:700}
.req-card .meta{color:var(--ink-2);font-size:13.5px;grid-column:1}
.req-card .right{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center}

/* forms */
.grid-form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px}
.field textarea{min-height:70px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;gap:7px;align-items:center;font-size:14px}
.checks input{accent-color:var(--accent);width:16px;height:16px}
@media (max-width:640px){.grid-form{grid-template-columns:1fr}}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
#compare table,#offer-form table{min-width:620px}
.feed-grid > *{min-width:0}
.best{white-space:nowrap;background:var(--ok-soft);color:var(--ok);font-weight:700;border-radius:6px;padding:2px 6px}
.items-tbl input{width:100%;min-width:90px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px}
.sup-name{font-weight:600}
.stars{color:var(--accent);font-weight:700;white-space:nowrap}

/* status timeline */
.flow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 2px}
.flow span{flex:1 0 auto;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;text-align:center}
.flow span.done{background:var(--ok-soft);color:var(--ok)}
.flow span.now{background:var(--accent);color:var(--accent-ink)}

.chosen-banner{background:var(--ok-soft);color:var(--ink);border-radius:var(--radius-m);padding:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.qa{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin-top:10px}

/* catalog */
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap}
.cat-chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500}
.cat-chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sup-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.sup-card:hover{border-color:var(--ink-2)}
.sup-card .badges{display:flex;gap:5px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--ink-2)}

/* telegram mock */
.tg{background:#E7EEF4;border-radius:22px;padding:14px;max-width:320px;border:6px solid var(--panel)}
.tg-h{display:flex;gap:8px;align-items:center;font-weight:700;color:#1E2226;font-size:14px;margin-bottom:10px}
.tg-h i{width:28px;height:28px;border-radius:50%;background:var(--accent);display:inline-block}
.tg-msg{background:#FFFFFF;color:#1E2226;border-radius:14px 14px 14px 4px;padding:11px 13px;font-size:13.5px;line-height:1.45}
.tg-msg small{display:block;color:#6B7680;margin-top:6px;text-align:right}
.tg-btn{margin-top:6px;width:100%;border:0;background:#FFFFFF;color:#2A7FC1;font-weight:600;border-radius:10px;padding:9px}
.feed-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
@media (max-width:980px){.feed-grid{grid-template-columns:1fr}}

/* plans */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plan{border:1px solid var(--line);border-radius:var(--radius-l);padding:22px;background:var(--surface)}
.plan.main{border:2px solid var(--accent)}
.plan .price{font-family:var(--display);font-size:30px;font-weight:700;margin:10px 0 2px}
.plan ul{padding-left:18px;color:var(--ink-2);margin:14px 0 18px}
.plan li{margin:5px 0}
@media (max-width:700px){.plans{grid-template-columns:1fr}}

/* moderator */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px}
.metric b{display:block;font-family:var(--display);font-size:28px;font-weight:700;margin:4px 0}
.metric span{font-size:13px;color:var(--ink-2)}
@media (max-width:860px){.metrics{grid-template-columns:1fr 1fr}}
.bars{display:flex;gap:14px;align-items:flex-end;height:160px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:56px;background:var(--accent);border-radius:6px 6px 2px 2px}
.bar span{font-size:12px;color:var(--ink-2)}
.bar b{font-size:13px}
.q-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.q-row:last-child{border-bottom:0}
.q-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.q-row{grid-template-columns:1fr}.q-row .acts{justify-content:flex-start}}

/* toast, modal */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel);color:var(--panel-ink);padding:12px 18px;border-radius:var(--radius-m);font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 28px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius-l);max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:24px}
.modal h2{font-size:22px}
.modal .close{float:right;border:0;background:var(--surface-2);border-radius:8px;padding:6px 10px}

/* tour */
.tour{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:360px;max-width:calc(100% - 28px);background:var(--panel);color:var(--panel-ink);border-radius:var(--radius-l);padding:18px;z-index:55;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.tour .step{font-size:12.5px;color:var(--panel-ink-2);font-weight:600}
.tour h3{font-size:17px;margin:6px 0}
.tour p{font-size:14px;color:var(--panel-ink-2)}
.tour .nav{display:flex;gap:8px;margin-top:14px;align-items:center}
.tour .nav .btn{border-color:var(--panel-line);background:none;color:var(--panel-ink)}
.tour .nav .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tour .x{margin-left:auto;border:0;background:none;color:var(--panel-ink-2);font-size:13px}
.tour-focus{outline:3px solid var(--accent)!important;outline-offset:4px;border-radius:12px;animation:pulse 1.4s ease 2}
@keyframes pulse{50%{outline-offset:9px}}
@media (prefers-reduced-motion:reduce){.tour-focus{animation:none}}
@media (max-width:640px){.tour{left:14px;right:14px;width:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="logo" data-go="home" aria-label="СпецЗакуп, на главную">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M2 16h20v3H2z"/><path d="M12 8V5"/></svg></span>
      СпецЗакуп
    </button>
    <span class="demo-pill">Демо-версия</span>
    <nav class="roles" aria-label="Роль">
      <button data-role="home">Главная</button>
      <button data-role="customer">Заказчик</button>
      <button data-role="supplier">Поставщик</button>
      <button data-role="moderator">Модератор</button>
    </nav>
    <button class="tour-btn" id="tourStart">Пройти демо</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<div id="tourRoot"></div>

<script>
/* ---------- demo data (all fictional) ---------- */

    <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-toast="Демо: здесь откроется WhatsApp поставщика">Написать в WhatsApp</button><button class="btn" data-goto="customer:new" data-closemodal>Разместить запрос</button></div>
  </div></div>`;

function closeModal(){document.getElementById('modalRoot').innerHTML=''}

/* toast */
let tt; function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2800)}

/* navigation helpers */
function go(role,view){S.role=role;if(view)S.view[role]=view;render();window.scrollTo({top:0})}

/* events */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-closemodal]'); if(!t) return;
  const d=t.dataset;
  if(d.closemodal!==undefined && (e.target===t || t.classList.contains('close') || d.goto)) { closeModal(); if(!d.goto) return; }
  if(d.role){go(d.role);return}
  if(d.go==='home'){go('home');return}
  if(d.goto){const [r,v]=d.goto.split(':');go(r,v);return}
  if(d.view){S.view[S.role]=d.view;render();window.scrollTo({top:0});return}
  if(d.openreq){S.custReq=d.openreq;go('customer','request');return}
  if(d.openfeed){S.supReq=d.openfeed;go('supplier','offer');updateSum();return}
  if(d.sup){openSup(d.sup);return}
  if(d.cat){S.catCat=d.cat;render();return}
  if(d.choose){const r=req(S.custReq);r.chosen=d.choose;r.status='chosen';render();toast(`Поставщик выбран: ${SUP[d.choose].name}`);return}
  if(d.review!==undefined){toast('Отзыв можно будет оставить после поставки');return}
  if(d.toast){toast(d.toast);return}
  if(d.approve){approve(d.approve);return}
  if(d.reject){S.queue=S.queue.filter(q=>q.id!==d.reject);render();toast('Возвращено на правку, автор получил комментарий');return}
  if(d.invite){S.invited[d.invite]=true;render();toast(`Приглашение отправлено: ${SUP[d.invite].name}`);return}
  if(t.id==='addRow'){document.getElementById('nf-items').insertAdjacentHTML('beforeend',itemRow());return}
  if(t.id==='tourStart'){startTour();return}
});
document.addEventListener('change',e=>{if(e.target.dataset.f){S.catF[e.target.dataset.f]=e.target.checked;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.price!==undefined)updateSum()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='new-form'){
    const id='0'+(S.nextId++);
    const items=[...document.querySelectorAll('#nf-items tr')].map(tr=>{const [n,q,u]=[...tr.querySelectorAll('input')].map(i=>i.value.trim());return {n,q:parseInt(q)||0,u}}).filter(i=>i.n);
    const title=document.getElementById('nf-title').value.trim()||'Новый запрос';
    S.requests.unshift({id,title,status:'moderation',deadline:document.getElementById('nf-date').value,left:'',items,docs:'Сертификат соответствия',pay:document.getElementById('nf-pay').value,offers:[],chosen:null});
    S.queue.unshift({id,type:'Запрос',title:`№${id} ${title}`,who:'ТОО «Атырау СтройСервис»',check:'БИН найден, компания действующая.'});
    go('customer','requests');toast(`Запрос №${id} отправлен на модерацию`);
  }
  if(e.target.id==='offer-form'){
    const f=S.feed.find(x=>x.id===S.supReq);f.sent=true;
    S.myOffers.unshift({id:f.id,title:f.title,sum:offerSum(),st:['Ожидает решения','warn']});
    render();updateSum();toast(`КП по запросу №${f.id} отправлено`);
  }
});
function approve(id){
  const q=S.queue.find(x=>x.id===id);S.queue=S.queue.filter(x=>x.id!==id);
  const r=req(id); if(r){r.status='collect';r.left='сбор КП 48 ч'}
  render();
  toast(q.type==='Документ'?'Напоминание отправлено поставщику':q.type==='Поставщик'?'Поставщик получил отметку «Проверен»':`Запрос №${id} одобрен, поставщики получили уведомление`);
}
function offerSum(){const f=S.feed.find(x=>x.id===S.supReq);return [...document.querySelectorAll('[data-price]')].reduce((a,i)=>a+(parseInt(i.value.replace(/\D/g,''))||0)*f.items[+i.dataset.price].q,0)}
function updateSum(){const el=document.getElementById('offerSum');if(el)el.textContent=money(offerSum())}

/* ---------- guided tour ---------- */
const TOUR=[
  {role:'home',t:'#hero-live',h:'Обещание заказчику',p:'Заказчик заходит на сайт и видит главное: разместил запрос — получил три сравнимых предложения за 48 часов.'},
  {role:'customer',view:'new',t:'#new-form',h:'Заказчик создаёт запрос',p:'Список позиций, количество, требования, сроки, оплата и нужные документы. Регистрация — только при отправке.'},
  {role:'moderator',view:'queue',t:'.q-row',h:'Модератор проверяет',p:'Проверяем БИН и понятность позиций. Так на площадке нет фейковых запросов и сбора чужих цен.'},
  {role:'supplier',view:'feed',t:'#tg-mock',h:'Поставщик получает уведомление',p:'Запрос приходит в Telegram только тем поставщикам, у которых есть нужная категория.'},
  {role:'supplier',view:'offer',sup:'0146',t:'#offer-form',h:'Поставщик отправляет КП',p:'Цены по позициям, срок, наличие и документы. Контакты заказчика он увидит, только если его выберут.'},
  {role:'moderator',view:'low',t:'#low-0144',h:'Если КП мало',p:'Когда за 24 часа пришло меньше трёх предложений, модератор сам подключает подходящих поставщиков.'},
  {role:'customer',view:'request',req:'0142',t:'#compare',h:'Заказчик сравнивает и выбирает',p:'Все предложения в одной таблице: лучшая цена и самый быстрый срок подсвечены. Договор — напрямую с поставщиком.'},
  {role:'supplier',view:'plan',t:'#plans',h:'Как зарабатывает площадка',p:'Заказчики пользуются бесплатно. Поставщики платят подписку за безлимит откликов и приоритет в каталоге.'},
  {role:'moderator',view:'dash',t:'#metrics',h:'Метрики, за которыми следим',p:'Доля запросов с тремя КП, скорость ответа и число проверенных поставщиков. Спасибо за внимание! Сағымжан, 8-777-482-2893.'}
];
let ti=-1;
function startTour(){ti=0;showStep()}
function endTour(){ti=-1;document.getElementById('tourRoot').innerHTML='';document.querySelectorAll('.tour-focus').forEach(x=>x.classList.remove('tour-focus'))}
function showStep(){
  const s=TOUR[ti];
  if(s.sup) S.supReq=s.sup; if(s.req) S.custReq=s.req;
  S.role=s.role; if(s.view) S.view[s.role]=s.view; render(); updateSum();
  const el=document.querySelector(s.t);
  if(el){el.classList.add('tour-focus');el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
  document.getElementById('tourRoot').innerHTML=`<div class="tour" role="dialog" aria-label="Демо-тур"><div class="step">Шаг ${ti+1} из ${TOUR.length}</div><h3>${s.h}</h3><p>${s.p}</p>
  <div class="nav">${ti>0?'<button class="btn small" id="tPrev">Назад</button>':''}<button class="btn small primary" id="tNext">${ti===TOUR.length-1?'Завершить':'Далее'}</button><button class="x" id="tEnd">Закрыть тур</button></div></div>`;
  document.getElementById('tNext').onclick=()=>{if(ti===TOUR.length-1){endTour();go('home')}else{ti++;showStep()}};
  const p=document.getElementById('tPrev'); if(p) p.onclick=()=>{ti--;showStep()};
  document.getElementById('tEnd').onclick=endTour;
}

render();
</script>
